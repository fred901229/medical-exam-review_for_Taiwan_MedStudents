<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrison's 閃卡 — 醫師二階國考複習</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #fff;
      --surface2: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text2: #64748b;
      --text3: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --card-front-bg: #eff6ff;
      --card-back-bg: #f0fdf4;
      --shadow: 0 4px 20px rgba(0,0,0,.08);
      --radius: 14px;
    }
    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #162032;
      --border: #334155;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #475569;
      --card-front-bg: #1e3a5f;
      --card-back-bg: #14532d;
      --shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 1rem; font-weight: 700; }
    .header-sub { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.82rem; color: var(--text2); transition: all .15s; }
    .btn-icon:hover { background: var(--border); color: var(--text); }
    .back-link { font-size: 0.8rem; color: var(--primary); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }

    /* Layout */
    .layout { display: flex; height: calc(100vh - 53px); }

    /* Sidebar */
    .sidebar { width: 250px; min-width: 200px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; flex-shrink: 0; }
    .sidebar-section { padding: 0 12px 8px; }
    .sidebar-label { font-size: 0.7rem; color: var(--text3); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 8px 0 4px; }
    .chapter-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.8rem; color: var(--text2); transition: background .1s; border-left: 3px solid transparent; }
    .chapter-item:hover { background: var(--surface2); }
    .chapter-item.active { background: #eff6ff; color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
    body.dark .chapter-item.active { background: #1e3a5f; }
    .chapter-item .ch-count { margin-left: auto; font-size: 0.7rem; color: var(--text3); background: var(--surface2); border-radius: 99px; padding: 1px 7px; }
    .progress-ring { width: 28px; height: 28px; flex-shrink: 0; }
    .filter-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); color: var(--text); font-size: 0.82rem; margin-bottom: 6px; }
    .filter-input:focus { outline: none; border-color: var(--primary); }

    /* Main */
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 16px; }

    /* Stats bar */
    .stats-bar { width: 100%; max-width: 680px; display: flex; gap: 10px; flex-wrap: wrap; }
    .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 4px 14px; font-size: 0.78rem; color: var(--text2); }
    .stat-pill b { color: var(--text); }

    /* Card area */
    .card-area { width: 100%; max-width: 680px; perspective: 1200px; }
    .card-wrapper { position: relative; width: 100%; min-height: 340px; }
    .card { width: 100%; min-height: 340px; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); cursor: pointer; }
    .card.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; min-height: 340px; backface-visibility: hidden; border-radius: var(--radius); padding: 28px 32px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
    .card-front { background: var(--card-front-bg); border: 2px solid #bfdbfe; }
    body.dark .card-front { border-color: #1d4ed8; }
    .card-back { background: var(--card-back-bg); border: 2px solid #bbf7d0; transform: rotateY(180deg); }
    body.dark .card-back { border-color: #15803d; }
    .card-label { font-size: 0.68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card-label-front { color: #2563eb; }
    .card-label-back { color: #16a34a; }
    .card-question { font-size: 1.05rem; font-weight: 600; color: var(--text); line-height: 1.55; flex: 1; }
    .card-answer { font-size: 0.92rem; color: var(--text); line-height: 1.7; flex: 1; white-space: pre-wrap; }
    .card-source { font-size: 0.7rem; color: var(--text3); margin-top: 16px; }
    .card-chapter-tag { font-size: 0.7rem; background: rgba(37,99,235,.1); color: var(--primary); border-radius: 6px; padding: 2px 8px; }
    .flip-hint { text-align: center; font-size: 0.75rem; color: var(--text3); margin-top: -4px; }

    /* Controls */
    .controls { width: 100%; max-width: 680px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 9px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: all .15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--text2); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface2); color: var(--text); }
    .btn-lg { padding: 12px 28px; font-size: 1rem; }
    .btn-know { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .btn-know:hover { background: #bbf7d0; }
    .btn-review { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .btn-review:hover { background: #fde68a; }
    body.dark .btn-know { background: #14532d; color: #4ade80; border-color: #166534; }
    body.dark .btn-review { background: #431407; color: #fbbf24; border-color: #92400e; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .counter { font-size: 0.85rem; color: var(--text2); padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; min-width: 90px; text-align: center; }

    /* Progress bar */
    .progress-wrap { width: 100%; max-width: 680px; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7c3aed); border-radius: 99px; transition: width .3s; }

    /* Keyboard hint */
    .kbd-hints { width: 100%; max-width: 680px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .kbd-hint { font-size: 0.72rem; color: var(--text3); display: flex; align-items: center; gap: 4px; }
    .kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: 0.7rem; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty h2 { font-size: 1.2rem; margin-bottom: 8px; }

    /* Completion */
    .completion { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; text-align: center; max-width: 480px; width: 100%; box-shadow: var(--shadow); }
    .completion h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .completion .score { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 16px 0; }

    /* Mobile */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .card-face { padding: 20px; }
      .card-question { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<header class="header">
  <div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" class="back-link">← 返回題庫</a>
      <h1>Harrison's Anki 閃卡</h1>
    </div>
    <div class="header-sub" id="header-sub">Harrison's Principles of Internal Medicine, 22nd Ed.</div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="shuffle-btn" title="隨機排序">🔀 隨機</button>
    <button class="btn-icon" id="review-only-btn" title="只看需複習的卡片">📌 複習卡</button>
    <button class="btn-icon" id="reset-ch-btn" title="重設本章進度">↺ 重設</button>
    <button class="btn-icon" id="export-btn" title="匯出 Anki CSV">⬇ Anki CSV</button>
    <button class="btn-icon" id="theme-btn">🌙</button>
  </div>
</header>

<div class="layout">
  <!-- Sidebar: chapter list -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <input type="text" class="filter-input" id="ch-filter" placeholder="搜尋章節...">
      <div class="sidebar-label">章節</div>
      <div id="chapter-list"></div>
    </div>
  </nav>

  <!-- Main flashcard area -->
  <main class="main" id="main">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <!-- Card -->
    <div class="card-area" id="card-area" style="display:none">
      <div class="card-wrapper">
        <div class="card" id="card" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="card-label card-label-front">問題 (點擊翻面)</div>
            <div class="card-question" id="card-front-text"></div>
            <div class="card-source" id="card-source-front"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-label card-label-back">答案</div>
            <div class="card-answer" id="card-back-text"></div>
            <div class="card-source" id="card-source-back"></div>
          </div>
        </div>
      </div>
      <p class="flip-hint" id="flip-hint">Space = 翻面 ｜ ← → = 前後 ｜ 1 = 已熟 ｜ 2 = 再練</p>
    </div>

    <!-- Controls -->
    <div class="controls" id="controls" style="display:none">
      <button class="btn btn-secondary" id="prev-btn" onclick="prevCard()">← 上一張</button>
      <span class="counter" id="counter">1 / 1</span>
      <button class="btn btn-secondary" id="next-btn" onclick="nextCard()">下一張 →</button>
    </div>
    <div class="controls" id="rating-controls" style="display:none">
      <button class="btn btn-review" onclick="markCard('review')">📌 需複習</button>
      <button class="btn btn-know" onclick="markCard('know')">✓ 已熟悉</button>
    </div>

    <!-- Keyboard hints -->
    <div class="kbd-hints" id="kbd-hints" style="display:none">
      <span class="kbd-hint"><kbd class="kbd">Space</kbd>翻面</span>
      <span class="kbd-hint"><kbd class="kbd">←</kbd><kbd class="kbd">→</kbd>切換</span>
      <span class="kbd-hint"><kbd class="kbd">1</kbd>已熟</span>
      <span class="kbd-hint"><kbd class="kbd">2</kbd>需複習</span>
    </div>

    <!-- Completion -->
    <div class="completion" id="completion" style="display:none">
      <div style="font-size:2.5rem">🎉</div>
      <h2>本章完成！</h2>
      <div class="score" id="completion-score">--</div>
      <p style="color:var(--text2);font-size:.9rem" id="completion-text"></p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="restartChapter()">重新開始</button>
        <button class="btn btn-primary" id="next-ch-btn">下一章 →</button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty" id="empty-state" style="display:none">
      <div style="font-size:3rem">📭</div>
      <h2>沒有符合的閃卡</h2>
      <p>請選擇其他章節或取消篩選條件</p>
    </div>
  </main>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────
let allCards = [];
let chapters = [];
let currentChapter = 'all';
let sessionCards = [];
let currentIndex = 0;
let isFlipped = false;
let reviewOnly = false;
let isShuffled = false;

// LocalStorage keys
const LS_KNOWN  = 'fc_known';
const LS_REVIEW = 'fc_review';
const LS_THEME  = 'fc_theme';
const LS_CH     = 'fc_chapter';

let knownSet  = new Set(JSON.parse(localStorage.getItem(LS_KNOWN)  || '[]'));
let reviewSet = new Set(JSON.parse(localStorage.getItem(LS_REVIEW) || '[]'));

// ── Init ──────────────────────────────────────────────────────
async function init() {
  if (localStorage.getItem(LS_THEME) === 'dark') document.body.classList.add('dark');

  try {
    const res = await fetch('flashcards.json?v=' + Date.now());
    const data = await res.json();
    allCards = data.cards || [];
    document.getElementById('header-sub').textContent =
      `${data.source || 'Harrison\'s 22nd Ed.'} ｜ 共 ${allCards.length} 張閃卡`;
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="empty"><div style="font-size:3rem">⚠️</div>
      <h2>載入失敗</h2><p>請確認 flashcards.json 存在</p></div>`;
    return;
  }

  buildChapterList();
  const savedCh = localStorage.getItem(LS_CH) || 'all';
  selectChapter(savedCh, false);
}

function buildChapterList() {
  const map = {};
  allCards.forEach(c => {
    if (!map[c.ch]) map[c.ch] = { ch: c.ch, title: c.chapter, part: c.part, count: 0 };
    map[c.ch].count++;
  });
  chapters = Object.values(map).sort((a, b) => a.ch - b.ch);

  const parts = {};
  chapters.forEach(c => {
    if (!parts[c.part]) parts[c.part] = [];
    parts[c.part].push(c);
  });

  const list = document.getElementById('chapter-list');
  list.innerHTML = '';

  // All cards item
  const allEl = document.createElement('div');
  allEl.className = 'chapter-item' + (currentChapter === 'all' ? ' active' : '');
  allEl.setAttribute('data-ch', 'all');
  allEl.innerHTML = `<span>全部章節</span><span class="ch-count">${allCards.length}</span>`;
  allEl.onclick = () => selectChapter('all');
  list.appendChild(allEl);

  for (const [part, chs] of Object.entries(parts)) {
    const sectionLabel = document.createElement('div');
    sectionLabel.className = 'sidebar-label';
    sectionLabel.textContent = part.replace('PART 6 ', '').substring(0, 40);
    list.appendChild(sectionLabel);

    chs.forEach(c => {
      const el = document.createElement('div');
      el.className = 'chapter-item';
      el.setAttribute('data-ch', c.ch);
      const known  = allCards.filter(x => x.ch === c.ch && knownSet.has(x.id)).length;
      const total  = c.count;
      const pct    = total > 0 ? Math.round(known / total * 100) : 0;
      el.innerHTML = `
        <svg class="progress-ring" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="11" fill="none" stroke="var(--border)" stroke-width="2.5"/>
          <circle cx="14" cy="14" r="11" fill="none" stroke="var(--primary)" stroke-width="2.5"
            stroke-dasharray="${2*Math.PI*11}"
            stroke-dashoffset="${2*Math.PI*11*(1-pct/100)}"
            stroke-linecap="round"
            transform="rotate(-90 14 14)"
            style="transition:stroke-dashoffset .4s"/>
        </svg>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Ch.${c.ch} ${c.title}</span>
        <span class="ch-count">${c.count}</span>`;
      el.onclick = () => selectChapter(c.ch);
      list.appendChild(el);
    });
  }

  // Chapter filter
  document.getElementById('ch-filter').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#chapter-list .chapter-item').forEach(el => {
      el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

function selectChapter(ch, scroll = true) {
  currentChapter = ch;
  reviewOnly = false;
  localStorage.setItem(LS_CH, ch);

  document.querySelectorAll('.chapter-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-ch') == ch);
  });

  loadSession();
  if (scroll) document.getElementById('main').scrollTo(0, 0);
}

function getCardsForChapter(ch) {
  return ch === 'all' ? [...allCards] : allCards.filter(c => c.ch == ch);
}

function loadSession() {
  let cards = getCardsForChapter(currentChapter);
  if (reviewOnly) cards = cards.filter(c => reviewSet.has(c.id));
  if (isShuffled) cards = shuffle([...cards]);
  sessionCards = cards;
  currentIndex = 0;
  isFlipped = false;
  renderCard();
  renderStats();
}

function renderCard() {
  const area = document.getElementById('card-area');
  const controls = document.getElementById('controls');
  const ratingCtls = document.getElementById('rating-controls');
  const kbdHints = document.getElementById('kbd-hints');
  const completion = document.getElementById('completion');
  const empty = document.getElementById('empty-state');

  if (sessionCards.length === 0) {
    area.style.display = 'none'; controls.style.display = 'none';
    ratingCtls.style.display = 'none'; kbdHints.style.display = 'none';
    completion.style.display = 'none'; empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  if (currentIndex >= sessionCards.length) {
    // Completion screen
    area.style.display = 'none'; controls.style.display = 'none';
    ratingCtls.style.display = 'none'; kbdHints.style.display = 'none';
    completion.style.display = 'block';
    const known = sessionCards.filter(c => knownSet.has(c.id)).length;
    document.getElementById('completion-score').textContent = `${known}/${sessionCards.length}`;
    document.getElementById('completion-text').textContent = `已熟悉 ${Math.round(known/sessionCards.length*100)}%`;
    return;
  }

  area.style.display = 'block'; controls.style.display = 'flex';
  ratingCtls.style.display = 'flex'; kbdHints.style.display = 'flex';
  completion.style.display = 'none';

  const card = sessionCards[currentIndex];
  document.getElementById('card-front-text').textContent = card.front;
  document.getElementById('card-back-text').textContent = card.back;
  document.getElementById('card-source-front').textContent = card.source || '';
  document.getElementById('card-source-back').textContent = card.source || '';

  const cardEl = document.getElementById('card');
  cardEl.classList.remove('flipped');
  isFlipped = false;

  document.getElementById('counter').textContent = `${currentIndex + 1} / ${sessionCards.length}`;
  document.getElementById('prev-btn').disabled = currentIndex === 0;
  document.getElementById('next-btn').disabled = currentIndex === sessionCards.length - 1;

  const pct = sessionCards.length > 0 ? ((currentIndex + 1) / sessionCards.length * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function renderStats() {
  const cards = getCardsForChapter(currentChapter);
  const known  = cards.filter(c => knownSet.has(c.id)).length;
  const review = cards.filter(c => reviewSet.has(c.id)).length;
  const bar = document.getElementById('stats-bar');
  bar.innerHTML = `
    <span class="stat-pill">共 <b>${cards.length}</b> 張</span>
    <span class="stat-pill">✓ 已熟悉 <b>${known}</b></span>
    <span class="stat-pill">📌 需複習 <b>${review}</b></span>
    <span class="stat-pill">未回答 <b>${cards.length - known - review}</b></span>
  `;
  buildChapterList();
}

function flipCard() {
  const cardEl = document.getElementById('card');
  isFlipped = !isFlipped;
  cardEl.classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (currentIndex < sessionCards.length - 1) { currentIndex++; renderCard(); }
  else if (currentIndex === sessionCards.length - 1) { currentIndex++; renderCard(); }
}

function prevCard() { if (currentIndex > 0) { currentIndex--; renderCard(); } }

function markCard(type) {
  if (currentIndex >= sessionCards.length) return;
  const card = sessionCards[currentIndex];
  if (type === 'know') {
    knownSet.add(card.id);
    reviewSet.delete(card.id);
  } else {
    reviewSet.add(card.id);
    knownSet.delete(card.id);
  }
  localStorage.setItem(LS_KNOWN,  JSON.stringify([...knownSet]));
  localStorage.setItem(LS_REVIEW, JSON.stringify([...reviewSet]));
  renderStats();
  nextCard();
}

function restartChapter() {
  currentIndex = 0;
  isFlipped = false;
  loadSession();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Buttons ───────────────────────────────────────────────────
document.getElementById('shuffle-btn').addEventListener('click', () => {
  isShuffled = !isShuffled;
  document.getElementById('shuffle-btn').style.background = isShuffled ? 'var(--primary)' : '';
  document.getElementById('shuffle-btn').style.color = isShuffled ? '#fff' : '';
  loadSession();
});

document.getElementById('review-only-btn').addEventListener('click', () => {
  reviewOnly = !reviewOnly;
  const btn = document.getElementById('review-only-btn');
  btn.style.background = reviewOnly ? '#fbbf24' : '';
  btn.style.color = reviewOnly ? '#000' : '';
  loadSession();
});

document.getElementById('reset-ch-btn').addEventListener('click', () => {
  const cards = getCardsForChapter(currentChapter);
  cards.forEach(c => { knownSet.delete(c.id); reviewSet.delete(c.id); });
  localStorage.setItem(LS_KNOWN,  JSON.stringify([...knownSet]));
  localStorage.setItem(LS_REVIEW, JSON.stringify([...reviewSet]));
  renderStats();
  restartChapter();
});

document.getElementById('theme-btn').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem(LS_THEME, document.body.classList.contains('dark') ? 'dark' : 'light');
});

document.getElementById('export-btn').addEventListener('click', () => {
  const cards = getCardsForChapter(currentChapter);
  const rows = ['Chapter\tFront\tBack\tSource'];
  cards.forEach(c => {
    rows.push([`Ch.${c.ch} ${c.chapter}`, c.front, c.back, c.source].map(s => `"${(s||'').replace(/"/g,'""')}"`).join('\t'));
  });
  const blob = new Blob(['﻿' + rows.join('\n')], {type:'text/tab-separated-values;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `harrisons_ch${currentChapter}_anki.txt`;
  a.click();
});

document.getElementById('next-ch-btn').addEventListener('click', () => {
  const chNums = chapters.map(c => c.ch);
  const idx = chNums.indexOf(Number(currentChapter));
  if (idx >= 0 && idx < chNums.length - 1) selectChapter(chNums[idx + 1]);
  else selectChapter('all');
});

// ── Keyboard ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')       { e.preventDefault(); flipCard(); }
  else if (e.code === 'ArrowRight') nextCard();
  else if (e.code === 'ArrowLeft')  prevCard();
  else if (e.key === '1')  markCard('know');
  else if (e.key === '2')  markCard('review');
});

init();
</script>
</body>
