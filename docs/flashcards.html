<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrison's 閃卡 — 醫師二階國考複習</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <style>
    /* ── CSS Variables (dark-first) ── */
    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface2:     #1c2333;
      --surface3:     #21262d;
      --border:       #30363d;
      --border2:      #444c56;
      --text:         #e6edf3;
      --text2:        #8b949e;
      --text3:        #484f58;
      --primary:      #58a6ff;
      --primary-dim:  #1f3a5f;
      --success:      #3fb950;
      --success-dim:  #0d2c18;
      --warning:      #d29922;
      --warning-dim:  #2e1e00;
      --front-bg:     #161b22;
      --front-border: #1f3a5f;
      --back-bg:      #161b22;
      --back-border:  #1a3524;
      --shadow:       0 8px 32px rgba(0,0,0,.5);
      --radius:       16px;
      --section-bg:   #1c2333;
      --section-border: #30363d;
    }
    body.light {
      --bg:           #f4f6f9;
      --surface:      #ffffff;
      --surface2:     #f8fafc;
      --surface3:     #f1f5f9;
      --border:       #e2e8f0;
      --border2:      #cbd5e1;
      --text:         #0f172a;
      --text2:        #64748b;
      --text3:        #94a3b8;
      --primary:      #2563eb;
      --primary-dim:  #dbeafe;
      --success:      #16a34a;
      --success-dim:  #dcfce7;
      --warning:      #d97706;
      --warning-dim:  #fef3c7;
      --front-bg:     #eff6ff;
      --front-border: #bfdbfe;
      --back-bg:      #f0fdf4;
      --back-border:  #bbf7d0;
      --shadow:       0 4px 20px rgba(0,0,0,.08);
      --section-bg:   #f8fafc;
      --section-border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header-progress {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 0;
      overflow: hidden;
      margin-top: 4px;
    }
    .header-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      transition: width .4s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header h1 { font-size: 0.95rem; font-weight: 700; white-space: nowrap; }
    .header-sub { font-size: 0.72rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-icon {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--text2);
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-icon:hover { background: var(--border); color: var(--text); }
    .btn-icon.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .back-link { font-size: 0.78rem; color: var(--primary); text-decoration: none; flex-shrink: 0; }
    .back-link:hover { text-decoration: underline; }

    /* ── Layout ── */
    .layout { display: flex; height: calc(100vh - 49px); }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      min-width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 10px 0 16px;
      flex-shrink: 0;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .sidebar-section { padding: 0 10px 6px; }
    .sidebar-label {
      font-size: 0.67rem;
      color: var(--text3);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 10px 2px 4px;
    }
    .chapter-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--text2);
      border-radius: 8px;
      margin: 1px 4px;
      transition: background .1s, color .1s;
      border-left: 3px solid transparent;
    }
    .chapter-item:hover { background: var(--surface2); color: var(--text); }
    .chapter-item.active {
      background: var(--primary-dim);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 600;
    }
    .ch-count {
      margin-left: auto;
      font-size: 0.68rem;
      color: var(--text3);
      background: var(--surface3);
      border-radius: 99px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .progress-ring { width: 26px; height: 26px; flex-shrink: 0; }
    .filter-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    .filter-input:focus { outline: none; border-color: var(--primary); }
    .filter-input::placeholder { color: var(--text3); }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      gap: 14px;
    }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Stats bar ── */
    .stats-bar { width: 100%; max-width: 700px; display: flex; gap: 8px; flex-wrap: wrap; }
    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px 12px;
      font-size: 0.75rem;
      color: var(--text2);
    }
    .stat-pill b { color: var(--text); }

    /* ── 3D Card ── */
    .card-area { width: 100%; max-width: 700px; perspective: 1400px; }
    .card-wrapper { position: relative; }
    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 420px;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.4, 0, .2, 1);
      will-change: transform;
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }

    /* Card faces */
    .card-face {
      position: absolute;
      width: 100%;
      min-height: 420px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-front {
      background: var(--front-bg);
      border: 1.5px solid var(--front-border);
    }
    .card-back {
      background: var(--back-bg);
      border: 1.5px solid var(--back-border);
      transform: rotateY(180deg);
    }

    /* Front face content */
    .card-front-inner {
      padding: 28px 30px 24px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 420px;
    }
    .card-label {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: .10em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-label-front { color: var(--primary); }
    .card-label-back { color: var(--success); }
    .card-chapter-tag {
      font-size: 0.68rem;
      background: var(--primary-dim);
      color: var(--primary);
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }
    .card-question {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.6;
      flex: 1;
    }
    .flip-cue {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text3);
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* Back face — 3 sections */
    .card-back-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 420px;
    }
    .back-header {
      padding: 16px 24px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .back-sections {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .back-sections::-webkit-scrollbar { width: 4px; }
    .back-sections::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .back-section {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .back-section:last-child { border-bottom: none; }
    .back-section-header {
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: .10em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-section-header.answer { color: var(--success); }
    .back-section-header.keypoints { color: var(--warning); }
    .back-section-header.citation { color: var(--text3); }

    /* Answer content rendering */
    .ans-heading {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--warning);
      margin: 12px 0 4px;
      letter-spacing: .02em;
    }
    .ans-heading:first-child { margin-top: 0; }
    .ans-bullet {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      margin-bottom: 4px;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.65;
    }
    .ans-bullet-dot {
      color: var(--primary);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .ans-num {
      color: var(--primary);
      flex-shrink: 0;
      font-weight: 600;
      min-width: 22px;
      margin-top: 1px;
      font-size: 0.82rem;
    }
    .ans-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 4px;
    }
    .ans-gap { height: 6px; }

    /* Collapsible citation */
    .back-citation {
      padding: 0;
    }
    .back-citation summary {
      list-style: none;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: color .15s;
    }
    .back-citation summary:hover { color: var(--text2); }
    .back-citation summary::marker { display: none; }
    .back-citation summary::-webkit-details-marker { display: none; }
    .citation-arrow {
      transition: transform .2s;
      display: inline-block;
    }
    .back-citation[open] .citation-arrow { transform: rotate(90deg); }
    .citation-content {
      padding: 0 24px 16px;
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.5;
      font-style: italic;
      background: var(--surface3);
      margin: 0 8px 8px;
      border-radius: 8px;
      padding: 10px 14px;
    }

    /* ── Controls ── */
    .controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 9px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      transition: all .15s;
    }
    .btn-nav {
      background: var(--surface);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-nav:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
    .btn-nav:disabled { opacity: .3; cursor: not-allowed; }
    .btn-know {
      background: var(--success-dim);
      color: var(--success);
      border: 1px solid var(--success);
      border-opacity: .4;
    }
    .btn-know:hover { filter: brightness(1.15); }
    .btn-review {
      background: var(--warning-dim);
      color: var(--warning);
      border: 1px solid var(--warning);
      border-opacity: .4;
    }
    .btn-review:hover { filter: brightness(1.15); }
    .counter {
      font-size: 0.82rem;
      color: var(--text2);
      padding: 7px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      min-width: 80px;
      text-align: center;
    }

    /* ── Flip hint ── */
    .kbd-hints {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .kbd-hint { font-size: 0.7rem; color: var(--text3); display: flex; align-items: center; gap: 4px; }
    .kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 0.68rem;
      font-family: monospace;
    }

    /* ── Completion ── */
    .completion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .completion h2 { font-size: 1.4rem; margin-bottom: 10px; }
    .completion .score { font-size: 3.5rem; font-weight: 800; color: var(--primary); margin: 16px 0; }
    .completion p { color: var(--text2); font-size: 0.9rem; }
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    .btn-primary:hover { opacity: .9; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface3); }

    /* ── Empty ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty div { font-size: 3rem; margin-bottom: 12px; }
    .empty h2 { font-size: 1.2rem; color: var(--text); margin-bottom: 8px; }

    /* ── Card height spacer (keeps layout stable during 3D flip) ── */
    .card-spacer { width: 100%; min-height: 420px; visibility: hidden; pointer-events: none; }

    /* ── Mobile bottom bar ── */
    .mobile-bar { display: none; }

    /* ── Sidebar drawer (mobile) ── */
    .menu-btn { display: none; }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 150;
    }
    body.sidebar-open .sidebar-backdrop { display: block; }
    body.sidebar-open .sidebar {
      display: block !important;
      position: fixed;
      top: 0; left: 0;
      width: 80vw;
      max-width: 280px;
      height: 100%;
      z-index: 160;
      box-shadow: 4px 0 20px rgba(0,0,0,.4);
    }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text2);
        font-size: 1.1rem;
        width: 34px;
        height: 34px;
        cursor: pointer;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .layout { height: calc(100svh - 49px); }
      .header h1 { font-size: 0.88rem; }
      .header-sub { display: none; }
      .btn-icon { padding: 5px 7px; font-size: 0.75rem; }
      .card-front-inner { padding: 20px 18px 18px; }
      .back-header { padding: 12px 16px; }
      .back-section { padding: 12px 16px; }
      .back-citation summary { padding: 10px 16px; }
      .citation-content { margin: 0 6px 8px; }
      .card-question { font-size: 0.96rem; }
      .card.flipped .card-face { min-height: unset; }

      .controls { display: none !important; }
      .rating-controls { display: none !important; }
      .kbd-hints { display: none !important; }
      .main { padding-bottom: 80px; }

      .mobile-bar {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 64px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        z-index: 200;
        padding: 0 6px env(safe-area-inset-bottom, 0);
      }
      .mbar-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: none;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        font-size: 0.65rem;
        font-weight: 600;
        border-radius: 10px;
        transition: background .12s, color .12s;
        -webkit-tap-highlight-color: transparent;
      }
      .mbar-btn:active { background: var(--surface2); }
      .mbar-btn:disabled { opacity: .3; pointer-events: none; }
      .mbar-icon { font-size: 1.3rem; line-height: 1; }
      .mbar-btn.flip  { color: var(--primary); }
      .mbar-btn.know  { color: var(--success); }
      .mbar-btn.rev   { color: var(--warning); }
    }

    /* ── Swipe feedback (touch) ── */
    .card { touch-action: manipulation; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-link">← 題庫</a>
    <button class="menu-btn" onclick="openSidebar()">☰</button>
    <div>
      <h1>Harrison's 閃卡</h1>
      <div class="header-sub" id="header-sub">Harrison's Principles of Internal Medicine, 22nd Ed.</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="shuffle-btn" title="隨機排序">🔀</button>
    <button class="btn-icon" id="review-only-btn" title="只看需複習的卡片">📌 複習卡</button>
    <button class="btn-icon" id="reset-ch-btn" title="重設本章進度">↺ 重設</button>
    <button class="btn-icon" id="export-btn" title="匯出 Anki CSV">⬇ Anki</button>
    <button class="btn-icon" id="theme-btn" title="切換模式">☀️</button>
  </div>
  <div class="header-progress" style="flex-basis:100%">
    <div class="header-progress-fill" id="progress-fill"></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <input type="text" class="filter-input" id="ch-filter" placeholder="搜尋章節...">
      <div class="sidebar-label">章節</div>
      <div id="chapter-list"></div>
    </div>
  </nav>

  <main class="main" id="main">
    <!-- Card -->
    <div class="card-area" id="card-area" style="display:none">
      <div class="card-wrapper">
        <!-- Invisible spacer to hold layout height -->
        <div class="card-spacer" id="card-spacer"></div>
        <div class="card" id="card" onclick="flipCard()">

          <!-- Front -->
          <div class="card-face card-front">
            <div class="card-front-inner">
              <div class="card-label card-label-front">
                <span>問題</span>
                <span class="card-chapter-tag" id="card-ch-tag"></span>
              </div>
              <div class="card-question" id="card-front-text"></div>
              <div class="flip-cue">點擊卡片或按 <kbd class="kbd">Space</kbd> 查看答案</div>
            </div>
          </div>

          <!-- Back (3 sections) -->
          <div class="card-face card-back">
            <div class="card-back-inner">
              <div class="back-header">
                <div class="card-label card-label-back" style="margin:0">答案</div>
              </div>
              <div class="back-sections">
                <!-- Section 1: 答案解析 -->
                <div class="back-section" id="back-s1">
                  <div class="back-section-header answer">✦ 答案解析</div>
                  <div class="back-ans-content" id="back-ans-content"></div>
                </div>
                <!-- Section 2: 原文引用 (collapsible) -->
                <details class="back-section back-citation" id="back-s3">
                  <summary>
                    <span class="citation-arrow">▶</span>
                    <span class="back-section-header citation" style="margin:0">原文引用</span>
                  </summary>
                  <div class="citation-content" id="back-citation-text"></div>
                </details>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Navigation controls -->
    <div class="controls" id="controls" style="display:none">
      <button class="btn btn-nav" id="prev-btn" onclick="prevCard()">← 上一張</button>
      <span class="counter" id="counter">1 / 1</span>
      <button class="btn btn-nav" id="next-btn" onclick="nextCard()">下一張 →</button>
    </div>
    <!-- Rating controls (shown after flip) -->
    <div class="controls" id="rating-controls" style="display:none">
      <button class="btn btn-review" onclick="markCard('review')">📌 需複習</button>
      <button class="btn btn-know" onclick="markCard('know')">✓ 已熟悉</button>
    </div>

    <!-- Keyboard hints -->
    <div class="kbd-hints" id="kbd-hints" style="display:none">
      <span class="kbd-hint"><kbd class="kbd">Space</kbd> 翻面</span>
      <span class="kbd-hint"><kbd class="kbd">←</kbd><kbd class="kbd">→</kbd> 切換</span>
      <span class="kbd-hint"><kbd class="kbd">1</kbd> 已熟</span>
      <span class="kbd-hint"><kbd class="kbd">2</kbd> 需複習</span>
    </div>
    <div class="stats-bar" id="stats-bar"></div>

    <!-- Completion -->
    <div class="completion" id="completion" style="display:none">
      <div style="font-size:3rem">🎉</div>
      <h2>本章完成！</h2>
      <div class="score" id="completion-score">--</div>
      <p id="completion-text"></p>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="restartChapter()">重新開始</button>
        <button class="btn btn-primary" id="next-ch-btn">下一章 →</button>
      </div>
    </div>

    <!-- Empty -->
    <div class="empty" id="empty-state" style="display:none">
      <div>📭</div>
      <h2>沒有符合的閃卡</h2>
      <p>請選擇其他章節或取消篩選條件</p>
    </div>
  </main>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Mobile bottom bar -->
<div class="mobile-bar" id="mobile-bar">
  <button class="mbar-btn" id="mbar-prev" onclick="prevCard()">
    <span class="mbar-icon">←</span>
    <span>上一張</span>
  </button>
  <button class="mbar-btn rev" onclick="markCard('review')">
    <span class="mbar-icon">📌</span>
    <span>複習</span>
  </button>
  <button class="mbar-btn flip" onclick="flipCard()">
    <span class="mbar-icon">🔄</span>
    <span>翻面</span>
  </button>
  <button class="mbar-btn know" onclick="markCard('know')">
    <span class="mbar-icon">✓</span>
    <span>熟悉</span>
  </button>
  <button class="mbar-btn" id="mbar-next" onclick="nextCard()">
    <span class="mbar-icon">→</span>
    <span>下一張</span>
  </button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let allCards   = [];
let chapters   = [];
let currentChapter = 'all';
let sessionCards   = [];
let currentIndex   = 0;
let isFlipped  = false;
let reviewOnly = false;
let isShuffled = false;

const LS_KNOWN  = 'fc_known';
const LS_REVIEW = 'fc_review';
const LS_THEME  = 'fc_theme';
const LS_CH     = 'fc_chapter';

let knownSet  = new Set(JSON.parse(localStorage.getItem(LS_KNOWN)  || '[]'));
let reviewSet = new Set(JSON.parse(localStorage.getItem(LS_REVIEW) || '[]'));

// ── Init ────────────────────────────────────────────────────────────────
async function init() {
  // Dark mode by default; only switch to light if user explicitly chose it
  if (localStorage.getItem(LS_THEME) === 'light') {
    document.body.classList.add('light');
    document.getElementById('theme-btn').textContent = '🌙';
  } else {
    document.getElementById('theme-btn').textContent = '☀️';
  }

  try {
    const res = await fetch('flashcards.json?v=' + Date.now());
    const data = await res.json();
    allCards = data.cards || [];
    document.getElementById('header-sub').textContent =
      `Harrison's 22nd Ed. ｜ 共 ${allCards.length} 張閃卡`;
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="empty"><div>⚠️</div>
      <h2>載入失敗</h2><p>請確認 flashcards.json 存在</p></div>`;
    return;
  }

  buildChapterList();
  const savedCh = localStorage.getItem(LS_CH) || 'all';
  selectChapter(savedCh, false);
}

// ── Chapter list ─────────────────────────────────────────────────────────
function buildChapterList() {
  const map = {};
  allCards.forEach(c => {
    if (!map[c.ch]) map[c.ch] = { ch: c.ch, title: c.chapter, part: c.part, count: 0 };
    map[c.ch].count++;
  });
  chapters = Object.values(map).sort((a, b) => a.ch - b.ch);

  const parts = {};
  chapters.forEach(c => {
    const partKey = c.part || 'Other';
    if (!parts[partKey]) parts[partKey] = [];
    parts[partKey].push(c);
  });

  const list = document.getElementById('chapter-list');
  list.innerHTML = '';

  const allEl = document.createElement('div');
  allEl.className = 'chapter-item' + (currentChapter === 'all' ? ' active' : '');
  allEl.setAttribute('data-ch', 'all');
  const allKnown = allCards.filter(c => knownSet.has(c.id)).length;
  allEl.innerHTML = `
    <svg class="progress-ring" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="10" fill="none" stroke="var(--border)" stroke-width="2.5"/>
      <circle cx="13" cy="13" r="10" fill="none" stroke="var(--primary)" stroke-width="2.5"
        stroke-dasharray="${2*Math.PI*10}"
        stroke-dashoffset="${2*Math.PI*10*(1 - allKnown/allCards.length)}"
        stroke-linecap="round"
        transform="rotate(-90 13 13)"
        style="transition:stroke-dashoffset .4s"/>
    </svg>
    <span>全部章節</span>
    <span class="ch-count">${allCards.length}</span>`;
  allEl.onclick = () => selectChapter('all');
  list.appendChild(allEl);

  for (const [part, chs] of Object.entries(parts)) {
    const sectionLabel = document.createElement('div');
    sectionLabel.className = 'sidebar-label';
    // Shorten part label
    sectionLabel.textContent = part.replace(/^PART \d+ /, '').substring(0, 38);
    list.appendChild(sectionLabel);

    chs.forEach(c => {
      const el = document.createElement('div');
      el.className = 'chapter-item' + (currentChapter == c.ch ? ' active' : '');
      el.setAttribute('data-ch', c.ch);
      const known = allCards.filter(x => x.ch === c.ch && knownSet.has(x.id)).length;
      const pct   = c.count > 0 ? Math.round(known / c.count * 100) : 0;
      el.innerHTML = `
        <svg class="progress-ring" viewBox="0 0 26 26">
          <circle cx="13" cy="13" r="10" fill="none" stroke="var(--border)" stroke-width="2.5"/>
          <circle cx="13" cy="13" r="10" fill="none" stroke="var(--primary)" stroke-width="2.5"
            stroke-dasharray="${2*Math.PI*10}"
            stroke-dashoffset="${2*Math.PI*10*(1 - pct/100)}"
            stroke-linecap="round"
            transform="rotate(-90 13 13)"
            style="transition:stroke-dashoffset .4s"/>
        </svg>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Ch.${c.ch} ${c.title}</span>
        <span class="ch-count">${c.count}</span>`;
      el.onclick = () => selectChapter(c.ch);
      list.appendChild(el);
    });
  }

  document.getElementById('ch-filter').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    list.querySelectorAll('.chapter-item').forEach(el => {
      el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

// ── Card content rendering ───────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBackContent(text, container) {
  container.innerHTML = '';
  if (!text) return;
  let html = '';
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) { html += '<div class="ans-gap"></div>'; continue; }
    // Sub-heading: ends with ： or :
    if (t.endsWith('：') || (t.endsWith(':') && t.length < 40)) {
      html += `<div class="ans-heading">${escHtml(t)}</div>`;
      continue;
    }
    // Bullet
    const bm = t.match(/^[•\-\*]\s*(.*)/);
    if (bm) {
      html += `<div class="ans-bullet"><span class="ans-bullet-dot">•</span><span>${escHtml(bm[1])}</span></div>`;
      continue;
    }
    // Numbered item
    const nm = t.match(/^(\d+[\.\)])\s*(.*)/);
    if (nm) {
      html += `<div class="ans-bullet"><span class="ans-num">${escHtml(nm[1])}</span><span>${escHtml(nm[2])}</span></div>`;
      continue;
    }
    // Plain text
    html += `<div class="ans-text">${escHtml(t)}</div>`;
  }
  container.innerHTML = html;
}

// ── Session ───────────────────────────────────────────────────────────────
function openSidebar()  { document.body.classList.add('sidebar-open'); }
function closeSidebar() { document.body.classList.remove('sidebar-open'); }

function selectChapter(ch, scroll = true) {
  closeSidebar();
  currentChapter = ch;
  reviewOnly = false;
  document.getElementById('review-only-btn').classList.remove('active');
  localStorage.setItem(LS_CH, ch);
  buildChapterList();
  loadSession();
  if (scroll) document.getElementById('main').scrollTo(0, 0);
}

function getCardsForChapter(ch) {
  return ch === 'all' ? [...allCards] : allCards.filter(c => c.ch == ch);
}

function loadSession() {
  let cards = getCardsForChapter(currentChapter);
  if (reviewOnly) cards = cards.filter(c => reviewSet.has(c.id));
  if (isShuffled) cards = shuffle([...cards]);
  sessionCards = cards;
  currentIndex = 0;
  isFlipped = false;
  renderCard();
  renderStats();
}

// ── Render ────────────────────────────────────────────────────────────────
function renderCard() {
  const area       = document.getElementById('card-area');
  const controls   = document.getElementById('controls');
  const ratingCtls = document.getElementById('rating-controls');
  const kbdHints   = document.getElementById('kbd-hints');
  const completion = document.getElementById('completion');
  const empty      = document.getElementById('empty-state');

  if (sessionCards.length === 0) {
    area.style.display = 'none';
    controls.style.display = 'none';
    ratingCtls.style.display = 'none';
    kbdHints.style.display = 'none';
    completion.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  if (currentIndex >= sessionCards.length) {
    area.style.display = 'none';
    controls.style.display = 'none';
    ratingCtls.style.display = 'none';
    kbdHints.style.display = 'none';
    completion.style.display = 'block';
    const known = sessionCards.filter(c => knownSet.has(c.id)).length;
    document.getElementById('completion-score').textContent = `${known}/${sessionCards.length}`;
    document.getElementById('completion-text').textContent = `已熟悉 ${Math.round(known/sessionCards.length*100)}%`;
    return;
  }

  area.style.display = 'block';
  controls.style.display = 'flex';
  ratingCtls.style.display = 'flex';
  kbdHints.style.display = 'flex';
  completion.style.display = 'none';

  const card = sessionCards[currentIndex];

  // Front
  document.getElementById('card-front-text').textContent = card.front;
  document.getElementById('card-ch-tag').textContent = `Ch.${card.ch}`;

  // Back — render full content
  const s1 = document.getElementById('back-s1');
  renderBackContent(card.back, document.getElementById('back-ans-content'));
  s1.style.display = card.back ? '' : 'none';

  // Section 2: citation
  const citEl = document.getElementById('back-citation-text');
  const s3    = document.getElementById('back-s3');

  if (card.source) {
    citEl.textContent = card.source;
    s3.style.display = '';
    s3.removeAttribute('open'); // collapsed by default
  } else {
    s3.style.display = 'none';
  }

  // Reset flip state (disable transition to prevent flash of back face)
  const cardEl = document.getElementById('card');
  cardEl.style.transition = 'none';
  cardEl.classList.remove('flipped');
  cardEl.offsetHeight;
  cardEl.style.transition = '';
  isFlipped = false;

  // Update counter & nav
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${sessionCards.length}`;
  document.getElementById('prev-btn').disabled = currentIndex === 0;
  document.getElementById('next-btn').disabled = currentIndex >= sessionCards.length - 1;
  const mbarPrev = document.getElementById('mbar-prev');
  const mbarNext = document.getElementById('mbar-next');
  if (mbarPrev) mbarPrev.disabled = currentIndex === 0;
  if (mbarNext) mbarNext.disabled = currentIndex >= sessionCards.length - 1;

  // Progress fill
  const pct = (currentIndex + 1) / sessionCards.length * 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Sync spacer height after render
  requestAnimationFrame(syncCardHeight);
}

function syncCardHeight() {
  const front   = document.querySelector('.card-front');
  const back    = document.querySelector('.card-back');
  const spacer  = document.getElementById('card-spacer');
  const cardEl  = document.getElementById('card');
  if (!front || !back || !spacer) return;
  const h = Math.max(front.scrollHeight, back.scrollHeight, 420);
  spacer.style.minHeight = h + 'px';
  cardEl.style.minHeight = h + 'px';
  front.style.minHeight  = h + 'px';
  back.style.minHeight   = h + 'px';
}

function renderStats() {
  const cards  = getCardsForChapter(currentChapter);
  const known  = cards.filter(c => knownSet.has(c.id)).length;
  const review = cards.filter(c => reviewSet.has(c.id)).length;
  document.getElementById('stats-bar').innerHTML = `
    <span class="stat-pill">共 <b>${cards.length}</b> 張</span>
    <span class="stat-pill">✓ 已熟悉 <b>${known}</b></span>
    <span class="stat-pill">📌 需複習 <b>${review}</b></span>
    <span class="stat-pill">未回答 <b>${cards.length - known - review}</b></span>
  `;
}

// ── Card flip ─────────────────────────────────────────────────────────────
function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (currentIndex <= sessionCards.length - 1) { currentIndex++; renderCard(); }
}
function prevCard() {
  if (currentIndex > 0) { currentIndex--; renderCard(); }
}

function markCard(type) {
  if (currentIndex >= sessionCards.length) return;
  const card = sessionCards[currentIndex];
  if (type === 'know') { knownSet.add(card.id);   reviewSet.delete(card.id); }
  else                  { reviewSet.add(card.id);  knownSet.delete(card.id); }
  localStorage.setItem(LS_KNOWN,  JSON.stringify([...knownSet]));
  localStorage.setItem(LS_REVIEW, JSON.stringify([...reviewSet]));
  renderStats();
  buildChapterList();
  nextCard();
}

function restartChapter() {
  currentIndex = 0;
  isFlipped = false;
  loadSession();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Button handlers ───────────────────────────────────────────────────────
document.getElementById('shuffle-btn').addEventListener('click', () => {
  isShuffled = !isShuffled;
  document.getElementById('shuffle-btn').classList.toggle('active', isShuffled);
  loadSession();
});

document.getElementById('review-only-btn').addEventListener('click', () => {
  reviewOnly = !reviewOnly;
  document.getElementById('review-only-btn').classList.toggle('active', reviewOnly);
  loadSession();
});

document.getElementById('reset-ch-btn').addEventListener('click', () => {
  if (!confirm('確定要重設本章進度嗎？')) return;
  getCardsForChapter(currentChapter).forEach(c => {
    knownSet.delete(c.id); reviewSet.delete(c.id);
  });
  localStorage.setItem(LS_KNOWN,  JSON.stringify([...knownSet]));
  localStorage.setItem(LS_REVIEW, JSON.stringify([...reviewSet]));
  renderStats();
  buildChapterList();
  restartChapter();
});

document.getElementById('theme-btn').addEventListener('click', () => {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem(LS_THEME, isLight ? 'light' : 'dark');
});

document.getElementById('export-btn').addEventListener('click', () => {
  const cards = getCardsForChapter(currentChapter);
  const rows = ['Chapter\tFront\tBack\tSource'];
  cards.forEach(c => {
    rows.push([`Ch.${c.ch} ${c.chapter}`, c.front, c.back, c.source]
      .map(s => `"${(s||'').replace(/"/g,'""')}"`).join('\t'));
  });
  const blob = new Blob(['﻿' + rows.join('\n')], {type:'text/tab-separated-values;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `harrisons_ch${currentChapter}_anki.txt`;
  a.click();
});

document.getElementById('next-ch-btn').addEventListener('click', () => {
  const chNums = chapters.map(c => c.ch);
  const idx = chNums.indexOf(Number(currentChapter));
  if (idx >= 0 && idx < chNums.length - 1) selectChapter(chNums[idx + 1]);
  else selectChapter('all');
});

// ── Keyboard ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space')        { e.preventDefault(); flipCard(); }
  else if (e.code === 'ArrowRight') nextCard();
  else if (e.code === 'ArrowLeft')  prevCard();
  else if (e.key === '1')  markCard('know');
  else if (e.key === '2')  markCard('review');
});

// ── Touch swipe ───────────────────────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;
document.getElementById('card').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('card').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) return;
  e.preventDefault();
  if (Math.abs(dx) > 60) {
    if (dx < 0) nextCard(); else prevCard();
  } else {
    flipCard();
  }
}, { passive: false });

init();
</script>
</body>
</html>
